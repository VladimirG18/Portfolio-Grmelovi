name: Update news

# Denní automatický sběr zpráv → data/news.json → nasazení webu.
# Souhrn: Anthropic API (když je secret), jinak bezplatné GitHub Models. Záznam od Claude
# z dneška (ranní plánovaný úkol) se nepřepisuje – tohle je záloha, kdyby nedoběhl.
on:
  schedule:
    - cron: '17 5 * * *'   # denně ráno (UTC), až po plánovaném úkolu Claude (~04:07 UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and summarize
        env:
          # Nepovinné: bez klíče píše souhrn bezplatný model z GitHub Models.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_news.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Beze změny."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update news"
          git push
          # Push z GITHUB_TOKEN nespouští další workflow, nasazení proto spustíme ručně.
          gh workflow run deploy.yml --ref main
