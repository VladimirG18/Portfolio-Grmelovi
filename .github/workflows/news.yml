name: Update news

# Varianta 1: denní automatický sběr zpráv → data/news.json → nasazení webu.
on:
  schedule:
    - cron: '17 5 * * 1-5'   # po–pá ráno (UTC), před otevřením burz
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch news and summarize
        env:
          # Nepovinné: bez klíče se obnoví jen titulky, souhrn zůstane z minula.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/update_news.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/news.json; then
            echo "Beze změny."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update news"
          git push
          # Push z GITHUB_TOKEN nespouští další workflow, nasazení proto spustíme ručně.
          gh workflow run deploy.yml --ref main
